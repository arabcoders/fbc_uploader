<style>
  .fbc-spa-loading {
    --bg: #fafaf9;
    --bg-deep: #f5f5f4;
    --panel: rgb(255 255 255 / 0.84);
    --border: rgb(28 25 23 / 0.1);
    --shadow: rgb(28 25 23 / 0.14);
    --text: #1c1917;
    --muted: #57534e;
    --accent: #4f46e5;
    --accent-soft: rgb(79 70 229 / 0.18);
    position: fixed;
    inset: 0;
    display: grid;
    box-sizing: border-box;
    min-height: 100dvh;
    place-items: center;
    overflow: auto;
    padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
      calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
    color: var(--text);
    font-family: system-ui, sans-serif;
    background:
      radial-gradient(circle at top left, var(--accent-soft), transparent 24%),
      radial-gradient(circle at top right, rgb(245 158 11 / 0.1), transparent 22%),
      linear-gradient(180deg, var(--bg-deep), var(--bg));
  }

  .dark .fbc-spa-loading {
    --bg: #0c0a09;
    --bg-deep: #1c1917;
    --panel: rgb(28 25 23 / 0.84);
    --border: rgb(168 162 158 / 0.16);
    --shadow: rgb(12 10 9 / 0.45);
    --text: #fafaf9;
    --muted: #a8a29e;
    --accent: #818cf8;
    --accent-soft: rgb(129 140 248 / 0.18);
  }

  .fbc-spa-loading__card {
    box-sizing: border-box;
    width: min(100%, 29rem);
    padding: clamp(1.3rem, 4vw, 1.65rem);
    border: 1px solid var(--border);
    border-radius: 1.1rem;
    background: var(--panel);
    box-shadow: 0 1rem 2.5rem var(--shadow);
    backdrop-filter: blur(16px);
  }

  .fbc-spa-loading__brand {
    display: flex;
    align-items: center;
    gap: 0.95rem;
  }

  .fbc-spa-loading__brand img {
    flex: none;
    object-fit: contain;
  }

  .fbc-spa-loading__label {
    margin: 0;
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .fbc-spa-loading__title {
    margin: 0.35rem 0 0;
    font-size: clamp(1.35rem, 4vw, 1.55rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .fbc-spa-loading__description {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.55;
  }

  .fbc-spa-loading__bar {
    height: 0.32rem;
    margin-top: 1.2rem;
    overflow: hidden;
    border-radius: 999px;
    background: var(--accent-soft);
  }

  .fbc-spa-loading__bar::before {
    display: block;
    width: 36%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    content: '';
  }

  @media (prefers-reduced-motion: no-preference) {
    .fbc-spa-loading__bar::before {
      animation: fbc-loader-slide 1.35s ease-in-out infinite;
    }
  }

  @keyframes fbc-loader-slide {
    from {
      transform: translateX(-130%);
    }

    to {
      transform: translateX(330%);
    }
  }
</style>

<div class="fbc-spa-loading">
  <div class="fbc-spa-loading__card" role="status">
    <div class="fbc-spa-loading__brand">
      <img src="/images/favicon.png" width="45" height="45" alt="" />
      <div>
        <p class="fbc-spa-loading__label">FBC Uploader</p>
        <h1 class="fbc-spa-loading__title">Loading App</h1>
      </div>
    </div>
    <p class="fbc-spa-loading__description">Getting the interface ready.</p>
    <div class="fbc-spa-loading__bar" aria-hidden="true"></div>
  </div>
</div>
